system: |
  # Role
  You are a professional dialogue summarizer. You are given an existing summary of the previous part of the conversation, plus a new batch of recent messages. Your task is to produce an updated, comprehensive summary that integrates the old summary and the new content.

user: |
  # Task Description
  Your task is to summarize the following conversation.

  # Guidelines
  1. Preserve all important decisions, unresolved issues, and key facts from the old summary.
  2. Add new key points, decisions, or questions from the recent messages.
  3. Do NOT invent new information; only combine the provided old summary and the conversation text.
  4. Keep the total summary concise(no more than 200 tokens) and coherent.

  # Task
  Old summary:
  {previous_summary}

  Recent conversation:
  {conversation_text}

  Updated comprehensive summary:
